<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Real-Time Chess</title>
    <meta name="description" content="Chess with no turns: both players move at once, pieces have hit points, and combat happens on contact." />
    <link rel="canonical" href="https://real-time-chess.com/" />

    <!-- Link previews (Reddit, Discord, Facebook, X); crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Real-Time Chess" />
    <meta property="og:url" content="https://real-time-chess.com/" />
    <meta property="og:title" content="Real-Time Chess: no turns, pieces have HP" />
    <meta property="og:description" content="Both players move at once and pieces fight on contact. Destroy the enemy King. Free in your browser, vs AI or a friend." />
    <meta property="og:image" content="https://real-time-chess.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A chess board mid-battle with health bars under each piece and attack arrows." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Real-Time Chess: no turns, pieces have HP" />
    <meta name="twitter:description" content="Both players move at once and pieces fight on contact. Free in your browser." />
    <meta name="twitter:image" content="https://real-time-chess.com/og-image.png" />
  </head>
  <body>
    <main id="app">
      <canvas id="board"></canvas>

      <div id="menu" class="overlay">
        <div class="panel">
          <h1>Real-Time Chess</h1>
          <p class="sub">No turns. Pieces have HP. Destroy the enemy King.</p>

          <h2>Game Speed</h2>
          <div class="row" id="speed-buttons">
            <button data-speed="fast">fast (1s)</button>
            <button data-speed="medium">medium (3s)</button>
            <button data-speed="slow">slow (5s)</button>
          </div>

          <h2>Opponent</h2>
          <div class="row">
            <button id="opp-ai">vs AI</button>
            <button id="opp-hotseat">2 Players (hotseat)</button>
            <button id="opp-online" disabled title="Online multiplayer is coming soon">
              Online<small>under construction</small>
            </button>
          </div>

          <h2 id="diff-label">AI Difficulty</h2>
          <div class="row stepper">
            <button id="diff-minus">-</button>
            <span id="diff-value">5</span>
            <button id="diff-plus">+</button>
          </div>
          <p class="hint">0 = AI disabled</p>

          <details id="hp-settings">
            <summary>Piece HP</summary>
            <div id="hp-grid" class="hp-grid"></div>
            <p class="hint">Each attacker deals 10 HP per second.</p>
            <button id="hp-reset">Reset to defaults</button>
          </details>

          <button id="start" class="primary">Start Game</button>
          <p class="hint">Enter to start</p>
        </div>
      </div>

      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <h1 id="winner-text"></h1>
          <button id="again" class="primary">Play Again</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
